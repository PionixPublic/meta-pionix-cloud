# meta-pionix-cloud layer configuration.
# Distributed alongside the cloud-connector source repo and pushed to the
# standalone meta-pionix-cloud downstream repo via `git subtree push`.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pionix-cloud"
BBFILE_PATTERN_meta-pionix-cloud = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pionix-cloud = "6"

LAYERDEPENDS_meta-pionix-cloud = "core"
LAYERSERIES_COMPAT_meta-pionix-cloud = "kirkstone scarthgap"
