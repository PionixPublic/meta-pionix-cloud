<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Grants the unprivileged 'cloud-connector' service user access to RAUC's
  Installer interface. RAUC's own default policy restricts the mutating
  methods (InstallBundle, Mark) to root; without this, the rauc-updater
  plugin's D-Bus calls are rejected with an access-denied error.
-->
<busconfig>
  <policy user="cloud-connector">
    <!-- Only the Installer methods the rauc-updater plugin actually calls;
         each future method must be added explicitly rather than granted by a
         bare interface-wide allow. -->
    <allow send_destination="de.pengutronix.rauc"
           send_interface="de.pengutronix.rauc.Installer"
           send_member="InstallBundle"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="de.pengutronix.rauc.Installer"
           send_member="InspectBundle"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="de.pengutronix.rauc.Installer"
           send_member="Mark"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="de.pengutronix.rauc.Installer"
           send_member="GetPrimary"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="de.pengutronix.rauc.Installer"
           send_member="GetSlotStatus"/>
    <!-- The plugin only reads RAUC properties; allow Get/GetAll, not Set. -->
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow receive_sender="de.pengutronix.rauc"/>
  </policy>
</busconfig>
